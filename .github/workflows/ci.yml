name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,notebooks]"
      - name: Test CPU suite
        run: pytest tests/ -v -m "not gpu"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
