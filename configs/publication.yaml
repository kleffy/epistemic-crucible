# Publication-scale evaluation sweep.
#
# All families x all agents (including the learned neural_ppo baseline) over 100
# seeds. The runner auto-assigns ~80/20 train/test per seed, so transfer_success,
# shortcut_sensitivity, and concept_reuse_proxy are all computable from one run.
#
# neural_ppo is eval-only here: train its checkpoints first with
#   python experiments/train_neural.py --config configs/neural.yaml
# then run this sweep. Checkpoints are loaded per family from checkpoint_dir.
