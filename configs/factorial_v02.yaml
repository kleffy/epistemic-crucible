# v0.2 planned local-only study. Serve one pinned model at a time on this
# endpoint, then run with --model LABEL --stage confirmatory and the frozen
# configs/confirmatory_manifest.json. The runner refuses a dirty or mismatched checkout.
base_url: http://127.0.0.1:8000/v1
variant: challenge_3x2
execution_mode: live_acquisition
concurrency: 1
serving_validation:
  minimum_replicated_prompt_groups: 1
  minimum_initial_mechanism_axis_groups: 640
  maximum_response_conflict_groups: 0
  maximum_action_conflict_groups: 0
  maximum_candidate_set_conflict_groups: 0
  require_all_uncached: true
  fail_closed: true
seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111,
        112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123,
        124, 125, 126, 127, 128, 129, 130, 131, 132, 133, 134, 135,
        136, 137, 138, 139, 140, 141, 142, 143, 144, 145, 146, 147,
        148, 149, 150, 151, 152, 153, 154, 155, 156, 157, 158, 159,
        160, 161, 162, 163]

controls:
  - mechanism_oracle
  - detector_policy
  - cue_follower
  - anti_cue
  - fixed_slot
  - random_committer
  - focal_uniform
  - abstain

prompt_arms:
  - {name: neutral, mode: neutral, count: 0, base_seed: 9000, seed_count: 64}
  - {name: cue_a, mode: cue, count: 6, base_seed: 9000, seed_count: 64}
  - {name: cue_b, mode: cue, count: 6, base_seed: 10000, seed_count: 64}
  - {name: mechanism_a, mode: mechanism, count: 6, base_seed: 11000, seed_count: 64}
  - {name: mechanism_b, mode: mechanism, count: 6, base_seed: 12000, seed_count: 64}

models:
  - label: qwen3.6-27b
    id: Qwen/Qwen3.6-27B
    revision: ea24fab73f0d8f18a59b05d79f5d2312a859b21a
    tokenizer_revision: ea24fab73f0d8f18a59b05d79f5d2312a859b21a
    # Selected by the amended length/parse-only pilot rule: matched serial
    # 2048- and 3072-token hard-seed runs both parsed 169/169 with zero length
    # finishes and byte-identical responses/actions.
    output_ceiling: 2048
    serving:
      backend: transformers
      quantization: bitsandbytes-nf4
      bitsandbytes_version: 0.50.0
      dtype: bfloat16
      device: cuda
      batch_size: 1
      language_model_only: true
      chat_template: model-default@pinned-revision
      engine_seed: 0
      do_sample: false
      transformers_version: 5.15.0
      torch_version: 2.11.0+cu130
      failed_backend_record: results/reference/v02/qwen_vllm_serving_preflight.json
      environment:
        CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        PYTHONHASHSEED: "0"
    generation:
      seed: 0
      extra_body:
        chat_template_kwargs: {enable_thinking: false}

  - label: mistral-small-3.2-24b
    id: mistralai/Mistral-Small-3.2-24B-Instruct-2506
    revision: 95a6d26c4bfb886c58daf9d3f7332c857cb27b43
    tokenizer_revision: 95a6d26c4bfb886c58daf9d3f7332c857cb27b43
    output_ceiling: 1024
    serving:
      backend: openai
      quantization: bitsandbytes-nf4
      bitsandbytes_version: 0.50.0
      dtype: bfloat16
      language_model_only: true
      tokenizer_mode: mistral
      chat_template: model-default@pinned-revision
      load_format: bitsandbytes
      ignore_patterns: [consolidated.safetensors]
      generation_config: vllm
      launch_script: experiments/serve_mistral_v02.sh
      engine_seed: 0
      batch_invariant_requested: true
      enforce_eager: true
      prefix_caching: false
      async_scheduling: false
      chunked_prefill: true
      environment:
        CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        PYTHONHASHSEED: "0"
        VLLM_BATCH_INVARIANT: "1"
      max_model_len: 8192
      max_num_seqs: 8
      vllm_version: 0.26.0
      ninja_version: 1.13.0
    generation:
      seed: 0
