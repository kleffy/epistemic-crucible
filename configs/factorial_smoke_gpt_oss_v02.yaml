# Results-branch serving smoke test. The full pilot seed list remains aligned
# with configs/pilot_manifest.json, but seed_count limits execution to one
# paired base seed (four quartet cells) in the neutral prompt arm.
base_url: http://127.0.0.1:8000/v1
concurrency: 1  # serial requests avoid batch-dependent greedy tie-breaking
seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007,
        1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015]
prompt_arms:
  - {name: neutral, mode: neutral, count: 0, base_seed: 9000, seed_count: 1}

models:
  - label: gpt-oss-20b
    id: openai/gpt-oss-20b
    revision: 6cee5e81ee83917806bbde320786a8fb61efebee
    tokenizer_revision: 6cee5e81ee83917806bbde320786a8fb61efebee
    output_ceiling: 1024
    serving:
      quantization: mxfp4
      response_format: harmony
      reasoning_parser: openai_gptoss
      chat_template: model-default@pinned-revision
      load_format: safetensors
      environment:
        PATH_prepend: .venv/bin
      max_model_len: 8192
      vllm_version: 0.26.0
    generation:
      reasoning_effort: low
      seed: 0
