[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epistemic-crucible"
version = "0.2.0"
description = "A generative developmental world for intervention-grounded intelligence evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]
notebooks = [
    "matplotlib>=3.5",
    "pandas>=1.3",
]
# Neural baseline (neural_ppo). Install the CUDA build matching your GPU, e.g.
# for Blackwell (RTX 50-series, sm_120):
#   pip install -e ".[gpu]" --index-url https://download.pytorch.org/whl/cu128
gpu = [
    "torch>=2.7",
]
# LLM agent: local open-weights via transformers (needs the [gpu] torch build)
# plus the API clients for the Anthropic and OpenAI backends, which the default
# run_llm_eval config and LLMAgent default backend use.
llm = [
    "transformers>=4.45",
    "accelerate>=0.34",
    "huggingface_hub>=0.25",
    "anthropic>=0.40",
    "openai>=1.50",
]
serve = [
    "vllm==0.26.0",
    "openai>=1.50",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: end-to-end tests that run the benchmark (deselect with '-m \"not slow\"')",
    "gpu: tests requiring the optional torch dependency (deselect with '-m \"not gpu\"')",
]

[tool.hatch.build.targets.wheel]
packages = ["crucible"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
